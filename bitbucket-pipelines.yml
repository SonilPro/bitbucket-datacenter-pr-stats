image: node:22
# Should switch to SFP-base-agent image

pipelines:
    default:
      - parallel:
            - step:
                  name: Linting
                  caches:
                    - node
                  script:
                    - sh -c 'echo "deb https://packages.atlassian.com/debian/atlassian-sdk-deb/ stable contrib" >>/etc/apt/sources.list'
                    - curl -sS https://packages.atlassian.com/api/gpg/key/public | gpg --dearmour -o /etc/apt/trusted.gpg.d/atlassian-sdk.gpg
                    - apt update -y
                    - apt install -y openjdk-17-jdk atlassian-plugin-sdk maven
                    - export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64/"
                    - export ATLAS_MVN="/usr/bin/mvn"
                    - atlas-version
                    - npm ci
                    - npm run lint

            - step:
                  name: Testing
                  caches:
                    - node
                  script:
                    - sh -c 'echo "deb https://packages.atlassian.com/debian/atlassian-sdk-deb/ stable contrib" >>/etc/apt/sources.list'
                    - curl -sS https://packages.atlassian.com/api/gpg/key/public | gpg --dearmour -o /etc/apt/trusted.gpg.d/atlassian-sdk.gpg
                    - apt update -y
                    - apt install -y openjdk-17-jdk atlassian-plugin-sdk maven
                    - export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64/"
                    - export ATLAS_MVN="/usr/bin/mvn"
                    - atlas-version
                    - npm ci
                    - npm run test
