image: blonghurst/clientside-extensions-template:1.0.0-m02

pipelines:
    default:
      - parallel:
            - step:
                  name: Linting
                  caches:
                    - node
                  script:
                    - npm ci
                    - npm run lint

            - step:
                  name: Testing
                  caches:
                    - node
                  script:
                    - npm ci
                    - npm run test
